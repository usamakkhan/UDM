<!doctype html><html><head><meta charset="utf-8"><title>Download links with UDM</title><link rel="stylesheet" href="links.css"></head><body>
<main><header><img src="icon.png" width="30" height="30" alt=""><h1>Download links with UDM</h1></header>
<p>Choose the files to add to UDM. You can select up to 100 links at a time.</p>
<nav><label>Filter <input id="filter" type="search" placeholder="File name or address"></label><button id="all">Check all visible</button><button id="none">Clear all</button><button id="files">Select file links</button></nav>
<div class="table"><table><thead><tr><th>Select</th><th>Name</th><th>Address</th></tr></thead><tbody id="rows"></tbody></table></div>
<footer><strong id="count">0 selected</strong><label><input id="later" type="checkbox">Download later</label><button id="download" disabled>Add selected to UDM</button></footer><p id="status" role="status"></p>
</main><script src="links.js"></script></body></html>
