<!doctype html><html><head><meta charset="utf-8"><title>Download links with UDM</title><link rel="stylesheet" href="links.css"></head><body>
<main><header><img src="icon.png" width="30" height="30" alt=""><h1>Download links with UDM</h1></header>
<p>Choose the files to add to UDM. You can select up to 500 collected links at a time. Leave Save as blank to use the server filename.</p>
<nav><label>Filter <input id="filter" type="search" placeholder="File name or address"></label><button id="all">Check all visible</button><button id="none">Clear all</button><button id="files">Select file links</button><label><input id="hideHtml" type="checkbox">Hide HTML files</label><label><input id="hideImages" type="checkbox">Hide images on this page</label><label><input id="linkDescriptions" type="checkbox">Use link texts as descriptions</label></nav><p id="inspection" role="status">Checking file sizes and types…</p>
<div class="table"><table><thead><tr><th>Select</th><th aria-sort="none"><button data-sort="name">Name</button></th><th aria-sort="none"><button data-sort="address">Address</button></th><th aria-sort="none"><button data-sort="size">Size</button></th><th aria-sort="none"><button data-sort="type">Type</button></th><th>Save as</th></tr></thead><tbody id="rows"></tbody></table></div>
<footer><strong id="count">0 selected</strong><label><input id="later" type="checkbox" checked>Download later</label><button id="download" disabled>Add selected to UDM</button></footer><p id="status" role="status"></p>
</main><script src="file-recognition.js"></script><script src="links.js"></script></body></html>
