<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media recovery — UDM</title><link rel="icon" href="icon.png"><link rel="stylesheet" href="recovery.css"></head>
<body><main><header><img src="icon.png" width="32" height="32" alt=""><h1>Review video handoffs</h1></header>
<p>Check whether UDM accepted a video when its reply was lost. Checking a receipt never resends the video.</p>
<div class="toolbar"><button id="desktop">Open UDM</button><button id="refresh">Refresh list</button></div>
<p id="status" role="status" aria-live="polite"></p><div id="entries"></div>
<p class="hint">Clearing a notice does not delete or restart a download. Return to the video panel to start another download after reviewing the outcome.</p>
</main><script src="media-recovery.js"></script></body></html>
